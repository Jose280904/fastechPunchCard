<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scheduled Maintenance | Central Web Services</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#ffffff;
            color:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            text-align:center;
            max-width:700px;
        }

        .logo{
            width:500px;
            max-width:90%;
            margin-bottom:45px;
        }

        h1{
            font-size:clamp(2.5rem,5vw,4.2rem);
            font-weight:700;
            margin-bottom:20px;
            color:#000;
        }

        p{
            font-size:1.35rem;
            line-height:1.6;
            color:#222;
        }

        @media (max-width:768px){

            .logo{
                width:320px;
                margin-bottom:35px;
            }

            p{
                font-size:1.15rem;
            }

        }
    </style>
</head>

<body>

    <div class="container">

        <img src="images/CWS_Logo.png" alt="Central Web Services" class="logo">

        <h1>We'll Be Back Soon</h1>

        <p>
            Sorry, our website is currently undergoing
            scheduled maintenance.
            <br><br>
            Please check back shortly.
        </p>

    </div>

</body>
</html>
